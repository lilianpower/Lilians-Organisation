<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Organização da Lilian</title>
  <meta name="description" content="Escreve qualquer coisa e a app organiza por ti.">
  <meta name="theme-color" content="#7c5cff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Organização">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Organização</h1>
    <span id="status" class="status" title="Estado da ligação"></span>
    <button id="installBtn" class="install" hidden>Instalar</button>
  </header>

  <p id="iosHint" class="hint" hidden>
    Para instalar: toca em <strong>Partilhar</strong> ⬆️ e depois
    <strong>Adicionar ao ecrã principal</strong> (tela inicial).
  </p>

  <form id="addForm" class="add" autocomplete="off">
    <textarea id="input" rows="2"
      placeholder="Escreve qualquer coisa… ex: comprar leite, dentista amanhã às 10h, ideia para o fim de semana"></textarea>
    <button type="submit">Adicionar</button>
  </form>

  <nav id="tabs" class="tabs" aria-label="Categorias"></nav>

  <input id="search" class="search" type="search" placeholder="Procurar…">

  <main id="list" class="list"></main>

  <footer class="foot">
    <button id="exportBtn" type="button">Guardar cópia</button>
    <label class="importLabel">
      Restaurar cópia
      <input id="importFile" type="file" accept="application/json" hidden>
    </label>
    <button id="clearDoneBtn" type="button">Limpar concluídos</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
