<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Organizar</title>
  <meta name="description" content="Escreve qualquer coisa e a app organiza por ti.">
  <meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15141c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Organizar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Organizar</h1>
    <button id="syncBtn" class="syncBtn" type="button">
      <span id="syncIcon">🔄</span> <span id="status"></span>
    </button>
    <button id="installBtn" class="install" type="button" hidden data-i18n="install"></button>
  </header>

  <p id="iosHint" class="hint" hidden></p>

  <section id="syncPanel" class="panel" hidden>
    <div id="syncOff">
      <p data-i18n="syncIntro"></p>
      <button id="createBtn" type="button" data-i18n="createShared"></button>
      <p class="or" data-i18n="haveCode"></p>
      <div class="row">
        <input id="codeInput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button id="joinBtn" type="button" data-i18n="join"></button>
      </div>
    </div>
    <div id="syncOn" hidden>
      <p id="syncState"></p>
      <p class="small"><span data-i18n="code"></span> <code id="codeShow"></code></p>
      <div class="row">
        <button id="inviteBtn" type="button" data-i18n="invite"></button>
        <button id="leaveBtn" type="button" class="secondary" data-i18n="leave"></button>
      </div>
    </div>
  </section>

  <nav id="views" class="views">
    <button type="button" data-view="dia"></button>
    <button type="button" data-view="mes"></button>
    <button type="button" data-view="lista"></button>
  </nav>

  <form id="addForm" class="add" autocomplete="off">
    <textarea id="input" rows="2"></textarea>
    <button type="submit" data-i18n="add"></button>
  </form>

  <div id="dayHead" class="dayhead">
    <button type="button" id="prevDay" class="arrow" aria-label="‹">‹</button>
    <div class="dayTitle">
      <strong id="dayTitle"></strong>
      <button type="button" id="todayBtn" class="link" data-i18n="goToday"></button>
    </div>
    <button type="button" id="nextDay" class="arrow" aria-label="›">›</button>
  </div>

  <section id="month" class="month">
    <div class="dayhead">
      <button type="button" id="prevMonth" class="arrow" aria-label="‹">‹</button>
      <div class="dayTitle"><strong id="monthTitle"></strong></div>
      <button type="button" id="nextMonth" class="arrow" aria-label="›">›</button>
    </div>
    <div id="monthGrid" class="grid"></div>
    <h2 id="selDayTitle" class="selDay"></h2>
  </section>

  <nav id="tabs" class="tabs"></nav>

  <input id="search" class="search" type="search">

  <main id="list" class="list"></main>

  <dialog id="editDlg" class="edit">
    <form method="dialog" id="editForm">
      <label><span data-i18n="fText"></span><textarea id="fText" rows="2"></textarea></label>
      <div class="row">
        <label><span data-i18n="fDate"></span><input id="fDate" type="date"></label>
        <label><span data-i18n="fTime"></span><input id="fTime" type="time"></label>
      </div>
      <label><span data-i18n="fCat"></span><select id="fCat"></select></label>
      <label><span data-i18n="fNote"></span><textarea id="fNote" rows="4"></textarea></label>
      <div class="row actions">
        <button type="button" id="fDelete" class="secondary danger" data-i18n="delete"></button>
        <span class="grow"></span>
        <button type="button" id="fCancel" class="secondary" data-i18n="cancel"></button>
        <button type="submit" id="fSave" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <footer class="foot">
    <button id="exportBtn" type="button" data-i18n="export"></button>
    <label class="importLabel">
      <span data-i18n="import"></span>
      <input id="importFile" type="file" accept="application/json" hidden>
    </label>
    <button id="clearDoneBtn" type="button" data-i18n="clearDone"></button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
