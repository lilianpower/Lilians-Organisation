# Configuração do Netlify: não há nada para "construir", só publicar esta pasta.
[build]
  publish = "."

# O service worker nunca deve ficar em cache, para as atualizações chegarem ao telemóvel.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
