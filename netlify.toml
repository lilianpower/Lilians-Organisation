# Configuração do Netlify: a app está na pasta "public", o servidor de sincronização em "netlify/functions".
[build]
  publish = "public"
  functions = "netlify/functions"

# O service worker nunca deve ficar em cache, para as atualizações chegarem ao telemóvel.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
